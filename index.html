<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Japanese Trainer</title>
<style>
:root{
  --bg:#f5f1e8;
  --card:#fffdf8;
  --card-alt:#fbf6ea;
  --border:#efe4cb;
  --border-soft:#efe8d6;
  --ink:#2a2620;
  --ink-soft:#4a3f2a;
  --muted:#8a7f68;
  --accent:#b06a2c;
  --accent-warm:#d6a33a;
  --accent-soft:#fbe9d0;
  --accent-soft-strong:#fde8c8;
  --ok:#4a8b5c;
  --err:#c25a4a;
  --btn-bg:#fffdf8;
  --btn-text:#5b4b2e;
  --btn-border:#e0d7c2;
  --btn-hover:#efe8d6;
  --btn-primary-text:#fff;
  --btn-primary-hover:#9a5a22;
  --shadow:0 6px 24px rgba(60,40,10,.08);
  --shadow-soft:0 4px 16px rgba(60,40,10,.07);
  --popup-bg:#fffdf8;
  --toast-bg:#fffdf8;
  --header-bg:rgba(245,241,232,.94);
  --hover-bg:#f7efdd;
  --bar-bg:#efe8d6;
  --highlight-bg:rgba(74,139,92,.28);
  --highlight-ring:rgba(74,139,92,.45);
  --token-dash:rgba(176,106,44,.4);
  --code-bg:#2b2620;
  --code-ink:#f5efe2;
  --code-key:#ffd08a;
  --code-string:#c8e6a0;
  --code-number:#f0a8c0;
  --code-null:#c0a0e0;
  --code-punct:#8a8070;
  --msg-error-bg:#fbeceb; --msg-error-br:#e8c7c3; --msg-error-tx:#8a2f24;
  --msg-warn-bg:#fbf3df;  --msg-warn-br:#ecd9a5;  --msg-warn-tx:#6b5114;
  --msg-ok-bg:#eaf4ec;    --msg-ok-br:#c8ddcc;    --msg-ok-tx:#2f5c3d;
  --kana-ring:rgba(214,163,58,.3);
  --overlay-bg:rgba(30,20,10,.55);
  --radius:16px;
  --radius-sm:12px;
}
html[data-theme="dark"]{
  color-scheme: dark;
  --bg:#141414;
  --card:#1a1a1a;
  --card-alt:#1f1f1f;
  --border:#2a2a2a;
  --border-soft:#232323;
  --ink:#e8e8e8;
  --ink-soft:#f0f0f0;
  --muted:#8a8a8a;
  --accent:#e8a34a;
  --accent-warm:#c47a2c;
  --accent-soft:#2a2218;
  --accent-soft-strong:#332a1d;
  --ok:#4ade80;
  --err:#f87171;
  --btn-bg:#1f1f1f;
  --btn-text:#d0d0d0;
  --btn-border:#2f2f2f;
  --btn-hover:#2a2a2a;
  --btn-primary-text:#141414;
  --btn-primary-hover:#f0b562;
  --shadow:0 6px 24px rgba(0,0,0,.45);
  --shadow-soft:0 4px 16px rgba(0,0,0,.35);
  --popup-bg:#232323;
  --toast-bg:#232323;
  --header-bg:rgba(20,20,20,.94);
  --hover-bg:#252525;
  --bar-bg:#2a2a2a;
  --highlight-bg:rgba(74,222,128,.25);
  --highlight-ring:rgba(74,222,128,.45);
  --token-dash:rgba(232,163,74,.4);
  --code-bg:#0e0e0e;
  --code-ink:#e8e8e8;
  --code-key:#e8a34a;
  --code-string:#a8e0a0;
  --code-number:#f0a8c0;
  --code-null:#c0a0e0;
  --code-punct:#6a6a6a;
  --msg-error-bg:#2a1818; --msg-error-br:#4a2828; --msg-error-tx:#ffb0b0;
  --msg-warn-bg:#2a2418;  --msg-warn-br:#4a4028;  --msg-warn-tx:#ffe0a0;
  --msg-ok-bg:#182a1d;    --msg-ok-br:#284a30;    --msg-ok-tx:#a8f0b8;
  --kana-ring:rgba(196,122,44,.35);
  --overlay-bg:rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html,body{margin:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  line-height:1.6;min-height:100vh;
  transition:background-color .2s,color .2s;
}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0 0 .35rem;line-height:1.25}
.jp{font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","Meiryo","Noto Sans JP",system-ui,sans-serif}
.muted{color:var(--muted)}
.hidden, [hidden]{display:none !important}
ruby{ruby-position:over}
rt{font-size:.5em;letter-spacing:0}
code,kbd,pre{font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace}

.btn{
  display:inline-flex;align-items:center;gap:.35rem;
  background:var(--btn-bg);color:var(--btn-text);
  border:1px solid var(--btn-border);border-radius:10px;
  padding:.42rem .8rem;cursor:pointer;white-space:nowrap;font-size:.9rem;
  transition:background .15s,border-color .15s,transform .05s;
}
.btn:hover{background:var(--btn-hover)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--btn-primary-text);font-weight:700}
.btn.primary:hover{background:var(--btn-primary-hover)}
.btn.danger{color:var(--err);border-color:var(--btn-border)}
.btn.danger:hover{background:var(--btn-hover)}
.btn.small{padding:.3rem .55rem;font-size:.82rem}
.btn.toggle[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent-warm);color:var(--accent);font-weight:700}
.btn.toggle[aria-pressed="true"]::before{content:"● ";}
.btn.toggle[aria-pressed="false"]::before{content:"○ ";}

.app-header{
  position:sticky;top:0;z-index:50;
  background:var(--header-bg);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--border-soft);
}
.header-inner{
  max-width:1600px;margin:0 auto;padding:.65rem 1rem;
  display:flex;align-items:center;gap:.8rem;flex-wrap:wrap;
}
.home-link{
  text-decoration:none;font-weight:600;padding:.38rem .75rem;
  border:1px solid var(--btn-border);border-radius:10px;background:var(--btn-bg);color:var(--btn-text);
}
.home-link:hover{background:var(--btn-hover)}
.home-link:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.brand{font-weight:700;color:var(--ink-soft)}
.header-lesson{color:var(--muted);font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:36ch}
.header-actions{margin-left:auto;display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.btn.theme-toggle{padding:.42rem .6rem;min-width:2.4rem;justify-content:center;font-size:1rem;line-height:1}

.app-main{max-width:1600px;margin:0 auto;padding:1rem 1rem 4rem}

.library-head{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:1rem}
.library-head h1{font-size:1.35rem;color:var(--ink-soft)}
.library-head .actions{display:flex;gap:.5rem;flex-wrap:wrap}

/* ============================================================
   Courses — responsive grid of clickable cards
   ============================================================ */
.course-list{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(300px, 1fr));
  gap:1rem;
  align-items:start;
}
@media (max-width:420px){
  .course-list{grid-template-columns:1fr}
}

.course-card{
  background:var(--card);border-radius:var(--radius);
  box-shadow:var(--shadow);
  display:flex;flex-direction:column;
  overflow:hidden;
  transition:box-shadow .2s,transform .15s;
  border:1px solid transparent;
}
.course-card:hover{
  box-shadow:0 10px 34px rgba(60,40,10,.14);
  transform:translateY(-1px);
}
.course-card.orphan{border:1px dashed var(--border)}

.course-card-head{
  padding:1.15rem 1.25rem .9rem;
  cursor:pointer;
  display:flex;
  gap:.75rem;
  align-items:flex-start;
  user-select:none;
  transition:background .15s;
  border:0;background:transparent;color:inherit;text-align:left;width:100%;
  font-family:inherit;
}
.course-card-head:hover{background:var(--hover-bg)}
.course-card-head:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

.course-head-main{flex:1 1 auto;min-width:0}
.course-head-main h3{font-size:1.1rem;color:var(--ink-soft);margin-bottom:.15rem}
.course-head-main .desc{color:var(--muted);font-size:.85rem;margin:.1rem 0 .35rem;line-height:1.45}
.course-head-main .meta{color:var(--muted);font-size:.78rem;margin:.15rem 0}

.course-open-hint{
  flex:0 0 auto;
  display:flex;align-items:center;gap:.35rem;
  color:var(--accent);font-size:.78rem;font-weight:700;
  letter-spacing:.04em;
  padding:.35rem .6rem;
  border-radius:99px;
  background:var(--accent-soft);
  white-space:nowrap;
}
.course-card.orphan .course-open-hint{
  color:var(--muted);background:var(--card-alt);
}
.course-card-head:hover .course-open-hint{
  background:var(--accent-warm);color:#fff;
}
.course-card.orphan .course-card-head:hover .course-open-hint{
  background:var(--muted);color:#fff;
}

.course-actions{
  padding:0 1.25rem 1.15rem;
  display:flex;gap:.4rem;flex-wrap:wrap;
}

.bar{height:8px;border-radius:99px;background:var(--bar-bg);overflow:hidden;margin:.5rem 0}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--accent-warm),var(--ok));width:0}

.empty{
  background:var(--card);border-radius:var(--radius);padding:2.2rem 1.2rem;
  text-align:center;color:var(--muted);box-shadow:var(--shadow-soft);
  grid-column:1 / -1;
}
.empty strong{color:var(--accent)}

.messages{margin-bottom:1rem;max-width:900px;margin-left:auto;margin-right:auto}
.msg{border-radius:var(--radius-sm);padding:.85rem 1rem;margin-bottom:.6rem;font-size:.92rem;background:var(--card)}
.msg.error{background:var(--msg-error-bg);border:1px solid var(--msg-error-br);color:var(--msg-error-tx)}
.msg.warn {background:var(--msg-warn-bg); border:1px solid var(--msg-warn-br); color:var(--msg-warn-tx)}
.msg.ok   {background:var(--msg-ok-bg);   border:1px solid var(--msg-ok-br);   color:var(--msg-ok-tx)}
.msg ul{margin:.4rem 0 0 1.1rem;padding:0}
.msg li{margin:.15rem 0}
.preview{
  background:var(--card);border-radius:var(--radius);padding:1.2rem;
  box-shadow:var(--shadow);margin-bottom:1rem;border:2px solid var(--accent-warm);
  max-width:900px;margin-left:auto;margin-right:auto;
}
.preview-list{margin:.5rem 0 0;padding-left:1.1rem;color:var(--muted);font-size:.9rem}
.preview-actions{display:flex;gap:.5rem;margin-top:.9rem;flex-wrap:wrap}

.course-picker{
  display:flex;gap:.5rem;align-items:flex-end;flex-wrap:wrap;
  margin:1rem 0 .6rem;padding-top:.9rem;border-top:1px solid var(--border);
}
.course-picker label{display:flex;flex-direction:column;gap:.3rem;flex:1 1 240px;min-width:0}
.course-picker label > span{
  font-size:.75rem;text-transform:uppercase;letter-spacing:.1em;
  color:var(--muted);font-weight:700;
}
.course-picker select{
  background:var(--btn-bg);border:1px solid var(--border);
  border-radius:10px;padding:.5rem .7rem;color:var(--ink);
  font-size:.9rem;width:100%;
}
.course-picker select:focus{outline:2px solid var(--accent);outline-offset:1px}

/* ============================================================
   Lesson view
   ============================================================ */
.lesson-toolbar{
  display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;
  background:var(--card);border-radius:var(--radius-sm);
  padding:.6rem .9rem;box-shadow:var(--shadow-soft);margin-bottom:.9rem;
}
.lesson-toolbar .toolbar-label{
  font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;
  color:var(--muted);font-weight:700;margin-right:.2rem;
}
.lesson-toolbar .spacer{margin-left:auto}

.grid4{display:grid;gap:.9rem;align-items:start;grid-template-columns:minmax(0,1fr)}
.grid4[data-vocab="hidden"]   .col-2{display:none}
.grid4[data-grammar="hidden"] .col-3{display:none}
.grid4[data-kana="hidden"]    .col-4{display:none}
@media (min-width:760px) and (max-width:1299px){
  .grid4{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
  .grid4[data-vocab="hidden"][data-grammar="hidden"][data-kana="hidden"]{grid-template-columns:minmax(0,1fr)}
  .grid4 .col-3, .grid4 .col-4{grid-column:1 / -1}
  .grid4[data-vocab="hidden"][data-grammar="shown"][data-kana="hidden"] .col-3{grid-column:auto}
  .grid4[data-vocab="hidden"][data-grammar="hidden"][data-kana="shown"] .col-4{grid-column:auto}
  .grid4[data-vocab="hidden"][data-grammar="shown"][data-kana="shown"]  .col-3{grid-column:auto}
}
@media (min-width:1300px){
  .grid4[data-vocab="hidden"][data-grammar="hidden"][data-kana="hidden"]{grid-template-columns:minmax(0,1fr)}
  .grid4[data-vocab="shown"][data-grammar="hidden"][data-kana="hidden"],
  .grid4[data-vocab="hidden"][data-grammar="shown"][data-kana="hidden"],
  .grid4[data-vocab="hidden"][data-grammar="hidden"][data-kana="shown"]{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}
  .grid4[data-vocab="shown"][data-grammar="shown"][data-kana="hidden"],
  .grid4[data-vocab="shown"][data-grammar="hidden"][data-kana="shown"],
  .grid4[data-vocab="hidden"][data-grammar="shown"][data-kana="shown"]{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) minmax(0,1fr)}
  .grid4[data-vocab="shown"][data-grammar="shown"][data-kana="shown"]{
    grid-template-columns:minmax(0,1.55fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);
  }
  .grid4 .col-2, .grid4 .col-3, .grid4 .col-4{grid-column:auto}
}
.col{min-width:0;display:flex;flex-direction:column;gap:.85rem}
.col-head{font-size:.75rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700;padding:0 .15rem .1rem}
.card{background:var(--card);border-radius:var(--radius);padding:1rem 1.1rem;box-shadow:var(--shadow)}

.sentence-nav{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin-bottom:.5rem}
.counter{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:700;font-size:.95rem}
.counter strong{color:var(--accent)}
.sentence-block{
  background:linear-gradient(180deg,var(--card-alt),var(--card));
  border-radius:var(--radius-sm);padding:1rem .9rem;margin-bottom:.85rem;
}
.sentence{
  font-size:clamp(1.35rem,2.4vw,2rem);line-height:2.5;text-align:center;margin:0;
  letter-spacing:.01em;word-break:normal;overflow-wrap:anywhere;
}
.sentence rt{color:var(--accent)}
.sentence .jp-unit.token{
  cursor:pointer;border-bottom:1px dashed var(--token-dash);
  border-radius:5px;padding:0 .05em;transition:background .15s;
}
.sentence .jp-unit.token:hover{background:var(--accent-soft)}
.sentence .jp-unit.token:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sentence .jp-unit.highlight{background:var(--highlight-bg);box-shadow:0 0 0 2px var(--highlight-ring)}
.romaji{text-align:center;color:var(--muted);margin:.4rem 0 0;font-style:italic;letter-spacing:.03em;font-size:.92rem}

.display-controls{display:flex;gap:.4rem;justify-content:center;flex-wrap:wrap;margin-bottom:.7rem}
.meaning-block{
  background:var(--card-alt);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:.7rem .85rem;margin-bottom:.7rem;
}
.meaning-label{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700;margin-bottom:.2rem}
.meaning{font-size:1rem;color:var(--ink-soft);margin:0}
.aids-controls{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.6rem;justify-content:center}

.player{background:var(--card-alt);border:1px solid var(--border);border-radius:var(--radius-sm);padding:.85rem}
.player-row{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin-bottom:.5rem}
.player-row:last-child{margin-bottom:0}
.player-seek{display:flex;align-items:center;gap:.5rem;width:100%}
.player-seek input[type=range]{flex:1;min-width:80px;accent-color:var(--accent)}
.time{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.8rem;min-width:3em;text-align:center}
.field{display:flex;align-items:center;gap:.3rem;font-size:.82rem;color:var(--muted)}
.field select,.field input[type=range]{
  background:var(--btn-bg);border:1px solid var(--border);border-radius:8px;
  padding:.22rem .4rem;color:var(--ink);font-size:.85rem;
}
.field input[type=range]{padding:0;width:90px;accent-color:var(--accent)}
.status{font-size:.78rem;color:var(--muted);margin-top:.5rem;min-height:1.1em}
.status.error{color:var(--err)}
#audioEl{display:none}
.player-upload{
  display:flex;gap:.4rem;align-items:center;flex-wrap:wrap;
  margin-top:.55rem;border-top:1px dashed var(--border);padding-top:.55rem;
}
.player-upload .fname{
  font-size:.75rem;color:var(--muted);
  overflow:hidden;text-overflow:ellipsis;max-width:20ch;white-space:nowrap;
}
.chunks{display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center;margin-top:.5rem}
.chunk{background:var(--card-alt);border:1px solid var(--border);border-radius:var(--radius-sm);padding:.45rem .7rem;text-align:center;min-width:0}
.chunk .ct{font-size:1rem;font-weight:600;display:block}
.chunk .cm{font-size:.74rem;color:var(--muted);margin-top:.1rem;display:block}
.connected{
  background:var(--card-alt);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:.6rem;text-align:center;font-size:1.05rem;margin-top:.5rem;
}
.complete{display:flex;justify-content:center;gap:.6rem;align-items:center;flex-wrap:wrap;margin-top:.7rem}
.progress{text-align:center;color:var(--muted);font-size:.85rem;margin:.4rem 0 0}

.unit-list{display:flex;flex-direction:column;gap:.4rem}
.unit{
  text-align:left;background:var(--card-alt);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:.55rem .7rem;cursor:pointer;
  display:flex;flex-direction:column;gap:.1rem;transition:background .15s,border-color .15s;width:100%;
}
.unit:hover{background:var(--hover-bg);border-color:var(--accent-warm)}
.unit:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.unit .u-t{font-size:1rem;font-weight:700;color:var(--ink-soft)}
.unit .u-s{font-size:.76rem;color:var(--accent)}
.unit .u-m{font-size:.84rem;color:var(--ink-soft)}
.unit .u-p{font-size:.66rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:.15rem}
.unit.grammar{border-left:3px solid var(--accent-warm)}

.grammar-item{
  border-left:3px solid var(--accent-warm);
  padding-left:.7rem;padding-top:.15rem;padding-bottom:.15rem;margin-bottom:.85rem;
}
.grammar-item:last-child{margin-bottom:0}
.grammar-item h4{font-size:.98rem;margin:0 0 .2rem;color:var(--ink-soft)}
.grammar-item p{margin:.15rem 0;font-size:.88rem;color:var(--ink-soft)}
.grammar-item .pattern{
  color:var(--accent);font-size:.82rem;font-weight:600;
  background:var(--accent-soft);display:inline-block;padding:.15rem .5rem;border-radius:6px;margin-top:.25rem;
}

.kana-panel{background:var(--card);border-radius:var(--radius);padding:1.1rem 1.1rem 1.15rem;box-shadow:var(--shadow)}
.kana-title{color:var(--accent);font-size:.95rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;margin:0 0 .3rem}
.kana-subtitle{color:var(--muted);font-size:.8rem;margin:0 0 .85rem;line-height:1.45}
.kana-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(72px, 1fr));gap:.5rem}
.kana-divider{grid-column:1 / -1;height:1px;background:var(--border);margin:.2rem 0 .05rem}
.kana-cell{
  background:var(--card-alt);border:1px solid var(--border);border-radius:10px;
  padding:.65rem .3rem .55rem;
  display:flex;flex-direction:column;align-items:center;text-align:center;
  gap:.1rem;min-width:0;transition:background .18s,border-color .18s,box-shadow .18s;
}
.kana-cell .kc-char{font-size:1.5rem;line-height:1.1;color:var(--ink-soft);font-weight:500;margin-bottom:.05rem}
.kana-cell .kc-romaji{font-size:.7rem;color:var(--muted);letter-spacing:.02em}
.kana-cell .kc-script{font-size:.55rem;color:var(--accent);text-transform:uppercase;letter-spacing:.1em;font-weight:700;margin-top:.1rem}
.kana-cell .kc-example{
  font-size:.76rem;color:var(--muted);margin-top:.2rem;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;
}
.kana-cell.in-sentence{background:var(--accent-soft-strong);border-color:var(--accent-warm);box-shadow:0 0 0 1px var(--kana-ring)}
.kana-cell.in-sentence .kc-char{color:var(--accent);font-weight:700}
.kana-cell.in-sentence .kc-romaji{color:var(--accent)}

const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.prototype.slice.call((r || document).querySelectorAll(s));

function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => (
    {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]
  ));
}
function isKana(ch){ return /[\u3040-\u309F\u30A0-\u30FF]/.test(ch); }
function toHiragana(ch){
  const c = ch.charCodeAt(0);
  return (c >= 0x30A1 && c <= 0x30F6) ? String.fromCharCode(c - 0x60) : ch;
}
function fmtTime(t){
  if(!isFinite(t) || t < 0) return "0:00";
  const m = Math.floor(t / 60), s = Math.floor(t % 60);
  return m + ":" + String(s).padStart(2, "0");
}
function attr(name, value){
  return "[" + name + '="' + String(value).replace(/["\\]/g, "\\$&") + '"]';
}
function isKanji(ch){
  return /[\u3005\u3400-\u4DBF\u4E00-\u9FFF\uF900-\uFAFF]/.test(ch);
}
function hasKanji(str){
  for(let i = 0; i < str.length; i++) if(isKanji(str[i])) return true;
  return false;
}
function uid(prefix){
  return (prefix || "id") + "-" + Date.now().toString(36) + "-" +
         Math.random().toString(36).slice(2, 8);
}

function makeRuby(text, reading){
  const t = String(text == null ? "" : text);
  const r = String(reading == null ? "" : reading);
  if(!t) return "";
  if(!r || r === t || !hasKanji(t)) return esc(t);
  let out = "", ti = 0, ri = 0;
  while(ti < t.length){
    const ch = t[ti];
    if(isKanji(ch)){
      let kj = ti;
      while(kj < t.length && isKanji(t[kj])) kj++;
      const kanjiRun = t.slice(ti, kj);
      const nextCh = t[kj];
      let end;
      if(nextCh === undefined){ end = r.length; }
      else{
        let found = -1;
        for(let p = ri + 1; p < r.length; p++){
          if(r[p] === nextCh){ found = p; break; }
        }
        end = (found === -1) ? r.length : found;
      }
      const rt = r.slice(ri, end);
      out += rt ? "<ruby>" + esc(kanjiRun) + "<rt>" + esc(rt) + "</rt></ruby>" : esc(kanjiRun);
      ri = end; ti = kj;
    }else{
      out += esc(ch);
      if(r[ri] === ch) ri++;
      ti++;
    }
  }
  return out;
}

function highlightJSON(value){
  const json = JSON.stringify(value, null, 2);
  return json
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/("(?:\\u[a-fA-F0-9]{4}|\\[^u]|[^\\"])*")(\s*:)?/g, function(match, str, colon){
      if(colon) return '<span class="k">' + str + "</span>" + colon.replace(":", '<span class="p">:</span>');
      return '<span class="s">' + str + "</span>";
    })
    .replace(/\b(true|false|null)\b/g, m => '<span class="z">' + m + "</span>")
    .replace(/(:\s*)(-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)/g,
      (_, pre, num) => pre + '<span class="n">' + num + "</span>");
}

/* ============================================================
   Modal helpers
   ============================================================ */
function openModal(html, opts){
  const host = $("#modalHost");
  const backdrop = document.createElement("div");
  backdrop.className = "modal-backdrop";
  backdrop.innerHTML = html;
  host.appendChild(backdrop);

  function close(){
    backdrop.remove();
    document.removeEventListener("keydown", onKey);
    document.body.style.overflow = "";
  }
  function onKey(e){ if(e.key === "Escape") close(); }
  document.addEventListener("keydown", onKey);
  document.body.style.overflow = "hidden";

  backdrop.addEventListener("click", e => { if(e.target === backdrop) close(); });
  backdrop.querySelectorAll("[data-modal-close]").forEach(b => {
    b.addEventListener("click", close);
  });
  return { el: backdrop, close };
}

/* ---------------- JSON format modal ---------------- */

            '<li><code>tokens[]</code> — connects portions of <code>expression</code> to <code>vocabulary[].id</code> so words become clickable.</li>' +
            '<li><code>audio</code> — a filename reference. The user can upload a real MP3 per sentence, which then takes priority.</li>' +
            '<li><code>kana[].script</code> — either <code>"hiragana"</code> or <code>"katakana"</code>.</li>' +

    catch(err){
      const ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      try{ document.execCommand("copy"); showToast("JSON copied to clipboard.", "ok"); }
      catch(e2){ showToast("Copy failed — select the text manually.", "error"); }
      ta.remove();
    }
  });
  $("#btnDownloadTemplate", modal.el).addEventListener("click", () => {
    const text = JSON.stringify(json, null, 2);
    const blob = new Blob([text], { type: "application/json;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "lesson-template.json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
    showToast("Template downloaded.", "ok");
  });
}

/* ============================================================
   Course lessons modal — paginated popup
   ============================================================ */
function openCourseLessonsModal(courseId, page){
  const course = getCourseById(courseId);
  if(!course) return;

  const lessons = getLessonsForCourse(courseId);
  const totalPages = Math.max(1, Math.ceil(lessons.length / LESSONS_PER_PAGE));
  page = Math.max(1, Math.min(page || 1, totalPages));

  const html =
    '<div class="modal modal-medium" role="dialog" aria-modal="true" aria-labelledby="courseLessonsTitle">' +
      '<div class="modal-head">' +
        '<div class="modal-head-main">' +
          '<h2 id="courseLessonsTitle"></h2>' +
          '<p class="sub" id="courseLessonsSub"></p>' +
        '</div>' +
        '<span class="spacer"></span>' +
        '<button class="close-btn" type="button" data-modal-close aria-label="Close">✕</button>' +
      '</div>' +
      '<div class="modal-body" id="courseLessonsBody"></div>' +
      '<div class="modal-pagination" id="courseLessonsPagination"></div>' +
      '<div class="modal-foot" id="courseLessonsFoot"></div>' +
    '</div>';

  const modal = openModal(html);

  const cm = {
    courseId: courseId,
    page: page,
    handle: modal
  };
  state.courseModal = cm;

  /* Wrap close to clear state */
  const originalClose = modal.close;
  modal.close = function(){
    state.courseModal = null;
    originalClose();
  };
  /* Rebind all close buttons to the wrapped close */
  modal.el.querySelectorAll("[data-modal-close]").forEach(b => {
    const clone = b.cloneNode(true);
    b.parentNode.replaceChild(clone, b);
    clone.addEventListener("click", () => modal.close());
  });
  /* Rebind backdrop */
  modal.el.addEventListener("click", e => {
    if(e.target === modal.el) modal.close();
  });
  /* Rebind Escape */
  document.addEventListener("keydown", function esc2(e){
    if(e.key === "Escape" && state.courseModal === cm){
      document.removeEventListener("keydown", esc2);
      modal.close();
    }
  });

  renderCourseLessonsModal();
}

function getCourseById(courseId){
  if(courseId === ORPHAN_ID){
    return {
      id: ORPHAN_ID,
      title: "Uncategorized",
      description: "Lessons not assigned to any course.",
      level: "—",
      orphan: true
    };
  }
  return state.courses.find(c => c.id === courseId) || null;
}

function getLessonsForCourse(courseId){
  if(courseId === ORPHAN_ID){
    const ids = new Set(state.courses.map(c => c.id));
    return state.lessons.filter(l => !l.courseId || !ids.has(l.courseId));
  }
  return state.lessons.filter(l => l.courseId === courseId);
}

function renderCourseLessonsModal(){
  const cm = state.courseModal;
  if(!cm) return;
  const course = getCourseById(cm.courseId);
  if(!course){ cm.handle.close(); return; }

  const lessons = getLessonsForCourse(cm.courseId);
  const totalSentences = lessons.reduce((sum, l) => sum + lessonSentenceCount(l), 0);
  const progMap = {};
  /* Rebuild prog map from cache (we keep progress records in state.progressCache) */
  (state.progressCache || []).forEach(p => { progMap[p.lessonId] = p; });
  let doneSentences = 0;
  lessons.forEach(l => { doneSentences += completedInLesson(progMap[l.id]); });
  const pct = totalSentences ? Math.round(doneSentences / totalSentences * 100) : 0;

  /* ---- Head ---- */
  const titleEl = $("#courseLessonsTitle", cm.handle.el);
  const subEl   = $("#courseLessonsSub",   cm.handle.el);
  titleEl.textContent = course.title;
  subEl.innerHTML =
    '<span>' + esc(course.level || "—") + "</span>" +
    '<span class="dot">•</span>' +
    "<span>" + lessons.length + " lesson" + (lessons.length === 1 ? "" : "s") + "</span>" +
    '<span class="dot">•</span>' +
    "<span>" + totalSentences + " sentences</span>" +
    '<span class="dot">•</span>' +
    "<span>Progress " + doneSentences + " / " + totalSentences + " (" + pct + "%)</span>";

  /* ---- Body ---- */
  const body = $("#courseLessonsBody", cm.handle.el);
  if(!lessons.length){
    body.innerHTML =
      '<div class="modal-empty">' +
        "<p><strong>No lessons yet.</strong></p>" +
        "<p>Use <strong>Import Lesson</strong> below to add one to this course.</p>" +
      "</div>";
  }else{
    const totalPages = Math.max(1, Math.ceil(lessons.length / LESSONS_PER_PAGE));
    cm.page = Math.max(1, Math.min(cm.page, totalPages));
    const start = (cm.page - 1) * LESSONS_PER_PAGE;
    const slice = lessons.slice(start, start + LESSONS_PER_PAGE);

    let html = '<div class="lesson-list-modal">';
    slice.forEach(l => {
      const total = lessonSentenceCount(l);
      const done = completedInLesson(progMap[l.id]);
      const lessonPct = total ? Math.round(done / total * 100) : 0;
      html +=
        '<article class="lesson-card" data-lesson-id="' + esc(l.id) + '">' +
          '<div class="lesson-card-main">' +
            "<h4>" + esc(l.title) + "</h4>" +
            (l.description ? '<p class="desc">' + esc(l.description) + "</p>" : "") +
            '<p class="meta">' + esc(l.level) + " • " + total + " sentences</p>" +
            '<div class="bar"><div class="bar-fill" style="width:' + lessonPct + '%"></div></div>' +
            '<p class="meta">Progress: ' + done + " / " + total + " (" + lessonPct + "%)</p>" +
          "</div>" +
          '<div class="lesson-card-actions">' +
            '<button class="btn small primary" data-action="open-lesson" data-id="' + esc(l.id) + '" type="button">Open</button>' +
            '<button class="btn small danger" data-action="delete-lesson" data-id="' + esc(l.id) + '" type="button">Delete</button>' +
          "</div>" +
        "</article>";
    });
    html += "</div>";
    body.innerHTML = html;
  }

  /* ---- Pagination ---- */
  const pag = $("#courseLessonsPagination", cm.handle.el);
  if(lessons.length <= LESSONS_PER_PAGE){
    pag.innerHTML = "";
    pag.hidden = true;
  }else{
    pag.hidden = false;
    const totalPages = Math.ceil(lessons.length / LESSONS_PER_PAGE);

    /* Page numbers, with ellipses when many pages */
    const pageNums = [];
    const cur = cm.page;
    if(totalPages <= 7){
      for(let i = 1; i <= totalPages; i++) pageNums.push(i);
    }else{
      pageNums.push(1);
      if(cur > 4) pageNums.push("…");
      for(let i = Math.max(2, cur - 1); i <= Math.min(totalPages - 1, cur + 1); i++) pageNums.push(i);
      if(cur < totalPages - 3) pageNums.push("…");
      pageNums.push(totalPages);
    }

    pag.innerHTML =
      '<button class="btn small" data-action="page-prev" type="button"' + (cur === 1 ? " disabled" : "") + '>‹ Prev</button>' +
      '<div class="page-nums">' +
        pageNums.map(p => {
          if(p === "…") return '<span class="ellipsis">…</span>';
          return '<button class="page-num' + (p === cur ? " active" : "") + '" data-action="page-go" data-page="' + p + '" type="button">' + p + '</button>';
        }).join("") +
      "</div>" +
      '<span class="page-info">Page <strong>' + cur + "</strong> / " + totalPages + "</span>" +
      '<button class="btn small" data-action="page-next" type="button"' + (cur === totalPages ? " disabled" : "") + '>Next ›</button>';
  }

  /* ---- Foot (actions) ---- */
  const foot = $("#courseLessonsFoot", cm.handle.el);
  if(course.orphan){
    foot.innerHTML =
      '<span class="muted" style="font-size:.82rem;align-self:center">These lessons have no course yet.</span>' +
      '<span class="spacer"></span>' +
      '<button class="btn" type="button" data-modal-close>Close</button>';
  }else{
    foot.innerHTML =
      '<button class="btn primary" data-action="import-to-course" data-course="' + esc(course.id) + '" type="button">Import Lesson</button>' +
      '<button class="btn" data-action="edit-course" data-course="' + esc(course.id) + '" type="button">Edit course</button>' +
      '<button class="btn danger" data-action="delete-course" data-course="' + esc(course.id) + '" type="button">Delete course</button>' +
      '<span class="spacer"></span>' +
      '<button class="btn" type="button" data-modal-close>Close</button>';
  }

  /* Rebind the close buttons that were regenerated inside foot */
  cm.handle.el.querySelectorAll("[data-modal-close]").forEach(b => {
    b.addEventListener("click", () => cm.handle.close());
  });
}

/* ============================================================
   IndexedDB
   ============================================================ */
function openDB(){
  return new Promise((resolve, reject) => {
    if(!("indexedDB" in window)){ reject(new Error("IndexedDB is not supported.")); return; }
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => {
      const db = req.result;
      if(!db.objectStoreNames.contains("lessons"))  db.createObjectStore("lessons",  { keyPath: "id" });
      if(!db.objectStoreNames.contains("audio"))    db.createObjectStore("audio",    { keyPath: ["lessonId","sentenceId"] });
      if(!db.objectStoreNames.contains("progress")) db.createObjectStore("progress", { keyPath: "lessonId" });
      if(!db.objectStoreNames.contains("courses"))  db.createObjectStore("courses",  { keyPath: "id" });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error || new Error("Unable to open database."));
  });
}
function dbReq(storeName, mode, fn){
  return new Promise((resolve, reject) => {
    if(!state.db){ reject(new Error("Storage unavailable.")); return; }
    let tx;
    try{ tx = state.db.transaction(storeName, mode); }catch(e){ reject(e); return; }
    const store = tx.objectStore(storeName);
    let request = null;
    try{ request = fn(store); }catch(e){ reject(e); return; }
    tx.oncomplete = () => resolve(request ? request.result : undefined);
    tx.onerror = () => reject(tx.error || new Error("DB error."));
    tx.onabort = () => reject(tx.error || new Error("DB aborted."));
  });
}
const idbGet    = (s, k) => dbReq(s, "readonly",  st => st.get(k));
const idbAll    = (s)    => dbReq(s, "readonly",  st => st.getAll());
const idbPut    = (s, v) => dbReq(s, "readwrite", st => st.put(v));
const idbDelete = (s, k) => dbReq(s, "readwrite", st => st.delete(k));

function deleteAudioForLesson(lessonId){
  return new Promise((resolve, reject) => {
    if(!state.db){ resolve(); return; }
    let tx;
    try{ tx = state.db.transaction("audio", "readwrite"); }catch(e){ reject(e); return; }
    const store = tx.objectStore("audio");
    let range;
    try{ range = IDBKeyRange.bound([lessonId], [lessonId, []]); }catch(e){ resolve(); return; }
    const req = store.openCursor(range);
    req.onsuccess = () => {
      const cur = req.result;
      if(cur){ cur.delete(); cur.continue(); }
    };
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

  state.settings.showVocabPanel   = !!state.settings.showVocabPanel;

let toastTimer = null;

function showPopup(anchor, html){
  const pop = $("#vocabPopup");
  pop.innerHTML = html; pop.hidden = false;
  const r = anchor.getBoundingClientRect();
  const pr = pop.getBoundingClientRect();
  const sx = window.scrollX || window.pageXOffset;
  const sy = window.scrollY || window.pageYOffset;
  const vw = document.documentElement.clientWidth;
  let left = r.left + sx + r.width/2 - pr.width/2;
  left = Math.max(sx + 8, Math.min(left, sx + vw - pr.width - 8));
  let top = r.bottom + sy + 8;
  if(top + pr.height > sy + window.innerHeight){
    top = r.top + sy - pr.height - 8;

  }
  pop.style.left = left + "px";
  pop.style.top = top + "px";
}

/* ============================================================
   Validation
   ============================================================ */
function validateLesson(data){
  const errors = [], warnings = [];
  if(!data || typeof data !== "object" || Array.isArray(data)){
    errors.push("The JSON root must be an object."); return { errors, warnings };
  }
  if(!data.app) errors.push("Missing required field: app");
  if(data.version === undefined || data.version === null || data.version === "")
    errors.push("Missing required field: version");
  const lesson = data.lesson;
  if(!lesson || typeof lesson !== "object" || Array.isArray(lesson)){
    errors.push("Missing required field: lesson");
  }else{
    if(!lesson.id)          errors.push("lesson: Missing required field: id");
    if(!lesson.title)       errors.push("lesson: Missing required field: title");
    if(!lesson.description) errors.push("lesson: Missing required field: description");
    if(!lesson.level)       errors.push("lesson: Missing required field: level");
  }
  if(!Array.isArray(data.sentences)){
    errors.push("Missing or invalid field: sentences (must be an array)");
    return { errors, warnings };
  }
  if(data.sentences.length === 0) errors.push("sentences: must contain at least one sentence");
  const seen = new Set();
  data.sentences.forEach((s, i) => {
    const label = "Sentence " + (i + 1);
    if(!s || typeof s !== "object" || Array.isArray(s)){ errors.push(label + ": must be an object."); return; }
    if(!s.id) errors.push(label + ": Missing required field: id");
    else if(seen.has(s.id)) errors.push(label + ': Duplicate sentence id "' + s.id + '"');
    else seen.add(s.id);
    if(!s.expression) errors.push(label + ": Missing required field: expression");
    if(!s.reading)    errors.push(label + ": Missing required field: reading");
    if(!s.meaning)    errors.push(label + ": Missing required field: meaning");
    if(!s.romaji)     warnings.push(label + ": optional field 'romaji' is missing.");
    if(s.vocabulary !== undefined && !Array.isArray(s.vocabulary)) errors.push(label + ": vocabulary must be an array.");
    if(s.tokens !== undefined && !Array.isArray(s.tokens)) errors.push(label + ": tokens must be an array.");
    if(s.chunks !== undefined && !Array.isArray(s.chunks)) errors.push(label + ": chunks must be an array.");
    if(s.grammar !== undefined && !Array.isArray(s.grammar)) errors.push(label + ": grammar must be an array.");
    if(s.kana !== undefined && !Array.isArray(s.kana)) errors.push(label + ": kana must be an array.");
  });
  return { errors, warnings };
}

    (sentences.length > 4 ? "<li>… and " + (sentences.length - 4) + " more</li>" : "") + "</ul>";
  if(warnings && warnings.length){
    html += '<div class="msg warn"><strong>Warnings</strong><ul>' +
      warnings.map(w => "<li>" + esc(w) + "</li>").join("") + "</ul></div>";
  }
  html += '<div class="course-picker">' +
    '<label><span>Import into course</span>' +
      '<select id="importCourse">' + noCourseOption + courseOptions + '</select>' +
    '</label>' +
    '<button class="btn small" type="button" id="btnNewCourseFromImport">+ New course</button>' +
  '</div>';
  html += '<div class="preview-actions">' +
    '<button class="btn primary" id="btnConfirmImport" type="button">Confirm Import</button>' +
    '<button class="btn" id="btnCancelImport" type="button">Cancel</button></div>';

  box.innerHTML = html; box.hidden = false;
  $("#btnConfirmImport").addEventListener("click", confirmImport);
  $("#btnCancelImport").addEventListener("click", clearImportUI);
  $("#btnNewCourseFromImport").addEventListener("click", () => {
    showCourseModal(null, async (courseData) => {
      const created = await createCourse(courseData, true);
      if(created){
        const sel = $("#importCourse");
        if(sel){
          const opt = document.createElement("option");
          opt.value = created.id; opt.textContent = created.title;
          opt.selected = true;
          sel.appendChild(opt);
          sel.value = created.id;
        }
      }
    });
  });
}
async function confirmImport(){
  if(!state.pending) return;
  const data = state.pending;
  const lessonId = data.lesson.id;

  const sel = $("#importCourse");
  const courseId = sel ? (sel.value || null) : null;

  let existing = null;
  try{ existing = await idbGet("lessons", lessonId); }catch(e){}
  if(existing && !window.confirm('A lesson with the id "' + lessonId + '" already exists.\n\nReplace it?')) return;

  const record = {
    id: lessonId,
    title: data.lesson.title,
    description: data.lesson.description,
    level: data.lesson.level,
    sentenceCount: data.sentences.length,
    importedAt: Date.now(),
    courseId: courseId,
    data: data
  };
  try{ await idbPut("lessons", record); }
  catch(err){ renderImportErrors(["Could not save lesson: " + err.message], []); return; }

  clearImportUI();
  $("#fileInput").value = "";
  await refreshLibrary();

  /* If the course modal is open for this course, refresh it */
  if(state.courseModal && state.courseModal.courseId === (courseId || ORPHAN_ID)){
    /* Bump to page 1 so the new lesson is visible */
    state.courseModal.page = 1;
    renderCourseLessonsModal();
  }

  showToast('Lesson "' + record.title + '" imported.', "ok");
}
function handleFileSelected(file){
  clearImportUI();
  if(!file) return;
  const preselected = state.pendingCourseId;
  state.pendingCourseId = null;

  const reader = new FileReader();
  reader.onerror = () => renderImportErrors(["The selected file could not be read."], []);
  reader.onload = () => {
    let parsed;
    try{ parsed = JSON.parse(String(reader.result)); }
    catch(err){ renderImportErrors(["Invalid JSON syntax: " + err.message], []); return; }
    const r = validateLesson(parsed);
    if(r.errors.length){ renderImportErrors(r.errors, r.warnings); return; }
    state.pending = parsed;
    renderImportPreview(parsed, r.warnings, preselected);
  };
  reader.readAsText(file, "utf-8");
}

/* ============================================================
   Course CRUD
   ============================================================ */
async function createCourse(data, silent){
  const course = {
    id: uid("course"),
    title: data.title,
    description: data.description || "",
    level: data.level || "Beginner",
    createdAt: Date.now()
  };
  try{ await idbPut("courses", course); }
  catch(err){ showToast("Could not create course: " + err.message, "error"); return null; }
  if(!silent){
    await refreshLibrary();
    showToast('Course "' + course.title + '" created.', "ok");
  }
  return course;
}

async function updateCourse(id, data){
  let existing = null;
  try{ existing = await idbGet("courses", id); }catch(e){}
  if(!existing){ showToast("Course not found.", "error"); return; }
  existing.title = data.title;
  existing.description = data.description || "";
  existing.level = data.level || "Beginner";
  existing.updatedAt = Date.now();
  try{ await idbPut("courses", existing); }
  catch(err){ showToast("Could not save course: " + err.message, "error"); return; }
  await refreshLibrary();
  if(state.courseModal && state.courseModal.courseId === id){
    renderCourseLessonsModal();
  }
  showToast("Course updated.", "ok");
}

async function deleteCourse(courseId, deleteLessons){
  const lessons = getLessonsForCourse(courseId);
  try{
    if(deleteLessons){
      for(const l of lessons){
        await idbDelete("lessons", l.id);
        await idbDelete("progress", l.id);
        await deleteAudioForLesson(l.id);
        if(localStorage.getItem(LS_CURRENT) === l.id) localStorage.removeItem(LS_CURRENT);
      }
    }else{
      for(const l of lessons){
        l.courseId = null;
        await idbPut("lessons", l);
      }
    }
    await idbDelete("courses", courseId);
  }catch(err){ showToast("Could not delete course: " + err.message, "error"); return; }

  /* Close any open modal referencing this course */
  if(state.courseModal && state.courseModal.courseId === courseId){
    state.courseModal.handle.close();
  }

  if(state.lesson && lessons.some(l => l.id === state.lesson.id)) goHome();
  await refreshLibrary();
  showToast("Course deleted.", "ok");
}

/* ============================================================
   Library rendering
   ============================================================ */
function lessonSentenceCount(l){
  return l.sentenceCount || (l.data && l.data.sentences ? l.data.sentences.length : 0);
}
function completedInLesson(prog){
  if(!prog || !prog.completed) return 0;
  let n = 0;
  for(const k in prog.completed) if(prog.completed[k]) n++;
  return n;
}

function buildCourseCard(course, lessons, progMap){
  const totalSentences = lessons.reduce((sum, l) => sum + lessonSentenceCount(l), 0);
  let doneSentences = 0;
  lessons.forEach(l => { doneSentences += completedInLesson(progMap[l.id]); });
  const pct = totalSentences ? Math.round(doneSentences / totalSentences * 100) : 0;

  const card = document.createElement("article");
  card.className = "course-card" + (course.orphan ? " orphan" : "");
  card.dataset.courseCard = course.id;

  const head = document.createElement("button");
  head.type = "button";
  head.className = "course-card-head";
  head.dataset.action = "open-course";
  head.dataset.course = course.id;
  head.setAttribute("aria-label", "Open " + course.title);
  head.innerHTML =
    '<div class="course-head-main">' +
      "<h3>" + esc(course.title) +
        '<span class="lesson-count-badge">' + lessons.length + "</span>" +
      "</h3>" +
      (course.description ? '<p class="desc">' + esc(course.description) + "</p>" : "") +
      '<p class="meta">' + esc(course.level || "—") + " • " +
        totalSentences + " sentences</p>" +
      '<div class="bar"><div class="bar-fill" style="width:' + pct + '%"></div></div>' +
      '<p class="meta">Progress: ' + doneSentences + " / " + totalSentences + " (" + pct + "%)</p>" +
    "</div>" +
    '<span class="course-open-hint">' +
      (lessons.length ? "View lessons" : "Open") + " →" +
    "</span>";
  card.appendChild(head);

  const actions = document.createElement("div");
  actions.className = "course-actions";
  if(course.orphan){
    actions.innerHTML =
      '<span class="muted" style="font-size:.82rem;align-self:center">Lessons not assigned to any course.</span>';
  }else{
    actions.innerHTML =
      '<button class="btn small" data-action="import-to-course" data-course="' + esc(course.id) + '" type="button">Import Lesson</button>' +
      '<button class="btn small" data-action="edit-course" data-course="' + esc(course.id) + '" type="button">Edit</button>' +
      '<button class="btn small danger" data-action="delete-course" data-course="' + esc(course.id) + '" type="button">Delete</button>';
  }
  card.appendChild(actions);
  return card;
}

async function refreshLibrary(){
  if(!state.db){
    $("#courseList").innerHTML = '<div class="empty">Local storage is unavailable, so courses cannot be loaded.</div>';
    return;
  }

  let courses = [], lessons = [], progs = [];
  try{
    courses = await idbAll("courses");
    lessons = await idbAll("lessons");
    progs   = await idbAll("progress");
  }catch(err){
    showToast("Could not read stored data: " + err.message, "error");
    return;
  }

  courses.sort((a,b) => (a.createdAt || 0) - (b.createdAt || 0));
  lessons.sort((a,b) => (b.importedAt || 0) - (a.importedAt || 0));
  state.courses = courses;
  state.lessons = lessons;
  state.progressCache = progs;

  const progMap = {};
  progs.forEach(p => { progMap[p.lessonId] = p; });

  const courseIds = new Set(courses.map(c => c.id));
  const lessonsByCourse = {};
  const orphans = [];
  lessons.forEach(l => {
    if(l.courseId && courseIds.has(l.courseId)){
      (lessonsByCourse[l.courseId] = lessonsByCourse[l.courseId] || []).push(l);
    }else{
      orphans.push(l);
    }
  });

  const container = $("#courseList");
  container.innerHTML = "";

  if(!courses.length && !orphans.length){
    container.innerHTML =
      '<div class="empty">' +
        "No courses yet. Click <strong>Create Course</strong> to get started, " +
        "then <strong>Import Lesson</strong> inside it. " +
        "You can also upload a lesson directly — it lands in <em>Uncategorized</em>." +
      "</div>";
    return;
  }

  courses.forEach(c => {
    container.appendChild(buildCourseCard(c, lessonsByCourse[c.id] || [], progMap));
  });
  if(orphans.length){
    const orphanCourse = {
      id: ORPHAN_ID,
      title: "Uncategorized",
      description: "Lessons not assigned to any course.",
      level: "—",
      orphan: true
    };
    container.appendChild(buildCourseCard(orphanCourse, orphans, progMap));
  }

  /* If a course modal is open, re-render it so it stays in sync */
  if(state.courseModal){
    renderCourseLessonsModal();
  }
}

async function openLesson(lessonId){
  let record = null;
  try{ record = await idbGet("lessons", lessonId); }catch(e){}
  if(!record || !record.data || !Array.isArray(record.data.sentences) || !record.data.sentences.length){
    showToast("This lesson is missing or has no valid sentences.", "error");
    localStorage.removeItem(LS_CURRENT);
    return;
  }
  state.lesson = record;

  let prog = null;
  try{ prog = await idbGet("progress", lessonId); }catch(e){}
  if(!prog || typeof prog !== "object") prog = defaultProgress(lessonId);
  prog.completed = prog.completed || {};
  prog.reading = prog.reading || {};
  prog.listening = prog.listening || {};
  state.progress = prog;

  const positions = loadPositions();
  let start = typeof positions[lessonId] === "number"
    ? positions[lessonId]
    : (typeof prog.currentSentence === "number" ? prog.currentSentence : 0);
  start = Math.max(0, Math.min(start, record.data.sentences.length - 1));
  state.index = start;

  state.kanaInventory = buildKanaInventory(record.data);

  localStorage.setItem(LS_CURRENT, lessonId);

  /* Close any open course modal */
  if(state.courseModal){ state.courseModal.handle.close(); }

  $("#lessonView").hidden = false;
  $("#btnCsv").hidden = false;

  state.reveals = { chunks: false, connected: false };
  renderLesson();

function currentSentence(){
  if(!state.lesson) return null;
  return state.lesson.data.sentences[state.index] || null;
}

function goToSentence(newIndex){
  if(!state.lesson) return;
  const total = state.lesson.data.sentences.length;
  if(!total) return;
  const idx = Math.max(0, Math.min(newIndex, total - 1));
  if(idx === state.index) return;
  state.index = idx;
  state.progress.currentSentence = idx;
  savePosition(state.lesson.id, idx);
  saveProgress();
  state.reveals = { chunks: false, connected: false };
  renderLesson();
}

/* ============================================================
   Kana inventory + rendering
   ============================================================ */
function collectKanaFromText(text){
  const set = new Set();
  for(const ch of String(text || "")){ if(isKana(ch) && ch !== "ー") set.add(ch); }
  return set;
}

function buildKanaInventory(lessonData){
  const map = new Map();
  function scriptOf(ch){
    const c = ch.charCodeAt(0);
    return (c >= 0x30A1 && c <= 0x30F6) ? "KATAKANA" : "HIRAGANA";
  }
  function romajiOf(ch){ return KANA_MAP[toHiragana(ch)] || ""; }

  lessonData.sentences.forEach(sentence => {
    (sentence.kana || []).forEach(k => {
      if(!k || !k.character || !isKana(k.character)) return;
      const ch = k.character;
      if(map.has(ch)){
        const e = map.get(ch);
        if(k.romaji) e.romaji = k.romaji;
        if(k.script) e.script = String(k.script).toUpperCase();
        if(k.reading && !e.example) e.example = k.reading;
        return;
      }
      map.set(ch, {
        char: ch, romaji: k.romaji || romajiOf(ch),
        script: k.script ? String(k.script).toUpperCase() : scriptOf(ch),
        example: k.reading || ""
      });
    });
    (sentence.vocabulary || []).forEach(v => {
      if(!v) return;
      const text = v.text || "", reading = v.reading || "";
      const all = collectKanaFromText(text);
      collectKanaFromText(reading).forEach(ch => all.add(ch));
      all.forEach(ch => {
        if(!map.has(ch)) map.set(ch, { char: ch, romaji: romajiOf(ch), script: scriptOf(ch), example: "" });
        const entry = map.get(ch);
        if(!entry.example){
          if(text && text.indexOf(ch) !== -1) entry.example = text;
          else if(reading && reading.indexOf(ch) !== -1) entry.example = reading;
        }
      });
    });
    collectKanaFromText(sentence.expression).forEach(ch => {
      if(!map.has(ch)){
        map.set(ch, { char: ch, romaji: romajiOf(ch), script: scriptOf(ch), example: sentence.expression || "" });
      }
    });
  });
  const items = Array.from(map.values());
  const hira = items.filter(x => x.script === "HIRAGANA");
  const kata = items.filter(x => x.script === "KATAKANA");
  return hira.concat(kata);
}

function kanaGridHTML(sentence){
  const inventory = state.kanaInventory || [];
  if(!inventory.length) return '<p class="muted">No kana found in this lesson.</p>';
  const present = collectKanaFromText(sentence.expression);
  (sentence.vocabulary || []).forEach(v => {
    if(!v) return;
    collectKanaFromText(v.text).forEach(ch => present.add(ch));
    collectKanaFromText(v.reading).forEach(ch => present.add(ch));
  });
  let html = '<div class="kana-grid" role="list">';
  let lastScript = null;
  inventory.forEach(k => {
    if(lastScript && k.script !== lastScript){
      html += '<div class="kana-divider" aria-hidden="true"></div>';
    }
    lastScript = k.script;
    const hi = present.has(k.char);
    const label = k.char + ", " + k.romaji + ", " + k.script.toLowerCase() +
      (k.example ? ", example " + k.example : "") +
      (hi ? ", appears in the current sentence" : "");
    html += '<div class="kana-cell' + (hi ? " in-sentence" : "") + '" role="listitem" aria-label="' + esc(label) + '">' +
      '<span class="kc-char jp">' + esc(k.char) + "</span>" +
      '<span class="kc-romaji">' + esc(k.romaji) + "</span>" +
      '<span class="kc-script">' + esc(k.script) + "</span>" +
      (k.example ? '<span class="kc-example jp">' + esc(k.example) + "</span>" : "") +
    "</div>";
  });
  html += "</div>";
  return html;
}

/* ============================================================
   Token building & sentence HTML
   ============================================================ */
function buildTokenList(sentence){
  const expr = sentence.expression || "";
  const vocab = Array.isArray(sentence.vocabulary) ? sentence.vocabulary : [];
  const vById = new Map();
  vocab.forEach(v => { if(v && v.id) vById.set(v.id, v); });
  const tokens = [];

  if(Array.isArray(sentence.tokens) && sentence.tokens.length){
    let cursor = 0;
    sentence.tokens.forEach(t => {
      if(!t || !t.text) return;
      let idx = expr.indexOf(t.text, cursor);
      if(idx === -1) idx = expr.indexOf(t.text);
      if(idx === -1) return;
      if(idx > cursor) tokens.push({ text: expr.slice(cursor, idx), plain: true });
      tokens.push({
        text: t.text,
        vocab: t.vocabularyId ? (vById.get(t.vocabularyId) || null) : null,
        grammarId: t.grammarId || null
      });
      cursor = idx + t.text.length;
    });
    if(cursor < expr.length) tokens.push({ text: expr.slice(cursor), plain: true });
    return tokens;
  }
  let i = 0, buf = "";
  while(i < expr.length){
    let best = null;
    for(const v of vocab){
      if(!v || !v.text) continue;
      if(expr.startsWith(v.text, i) && (!best || v.text.length > best.text.length)) best = v;
    }
    if(best){
      if(buf){ tokens.push({ text: buf, plain: true }); buf = ""; }
      tokens.push({ text: best.text, vocab: best, grammarId: null });
      i += best.text.length;
    }else{ buf += expr[i]; i++; }
  }
  if(buf) tokens.push({ text: buf, plain: true });
  return tokens;
}

function sentenceHTML(sentence){
  const tokens = buildTokenList(sentence);
  let html = "";
  tokens.forEach(t => {
    const cls = "jp-unit" + (t.plain ? "" : " token");
    let inner;
    if(!t.plain && t.vocab && state.settings.furigana && hasKanji(t.text)){
      inner = makeRuby(t.text, t.vocab.reading);
    }else{
      inner = esc(t.text);
    }
    let attrs = "";
    if(!t.plain && t.vocab){
      attrs = ' tabindex="0" role="button" data-vocab-id="' + esc(t.vocab.id) + '"' +
              ' aria-label="' + esc(t.text) + " — " + esc(t.vocab.meaning || "") + '. Activate for details."';
    }else if(!t.plain && t.grammarId){
      attrs = ' tabindex="0" role="button" data-grammar-id="' + esc(t.grammarId) + '"' +
              ' aria-label="' + esc(t.text) + ' — grammar unit."';
    }
    html += '<span class="' + cls + '"' + attrs + ">" + inner + "</span>";
  });
  return html;
}

function chunksHTML(sentence){
  const chunks = Array.isArray(sentence.chunks) ? sentence.chunks : [];
  if(!chunks.length) return '<p class="muted">No chunks provided for this sentence.</p>';
  return chunks.map(c =>
    '<div class="chunk"><span class="ct jp">' + esc(c.text || "") + "</span>" +
    '<span class="cm">' + esc(c.meaning || "") + "</span></div>"
  ).join("");
}

function vocabUnitsHTML(sentence){
  const vocab = Array.isArray(sentence.vocabulary) ? sentence.vocabulary : [];
  const grammar = Array.isArray(sentence.grammar) ? sentence.grammar : [];
  if(!vocab.length && !grammar.length) return '<p class="muted">No vocabulary or grammar data for this sentence.</p>';
  let html = "";
  vocab.forEach(v => {
    const sub = [v.reading, v.romaji].filter(Boolean).map(esc).join(" • ");
    html += '<button class="unit" type="button" data-action="highlight-vocab" data-vocab-id="' + esc(v.id) + '">' +
      '<span class="u-t jp">' + esc(v.text) + "</span>" +
      (sub ? '<span class="u-s">' + sub + "</span>" : "") +
      (v.meaning ? '<span class="u-m">' + esc(v.meaning) + "</span>" : "") +
      (v.partOfSpeech ? '<span class="u-p">' + esc(v.partOfSpeech) + "</span>" : "") +
    "</button>";
  });
  grammar.forEach(g => {
    html += '<button class="unit grammar" type="button" data-action="scroll-grammar">' +
      '<span class="u-t jp">' + esc(g.title) + "</span>" +
      (g.pattern ? '<span class="u-s">Pattern: ' + esc(g.pattern) + "</span>" : "") +
      (g.explanation ? '<span class="u-m">' + esc(g.explanation) + "</span>" : "") +
      '<span class="u-p">grammar</span>' +
    "</button>";
  });
  return html;
}

function grammarNotesHTML(sentence){
  const grammar = Array.isArray(sentence.grammar) ? sentence.grammar : [];
  if(!grammar.length) return '<p class="muted">No grammar notes for this sentence.</p>';
  return grammar.map(g =>
    '<div class="grammar-item">' +
      '<h4 class="jp">' + esc(g.title) + "</h4>" +
      (g.explanation ? "<p>" + esc(g.explanation) + "</p>" : "") +
      (g.pattern ? '<p class="pattern jp">Pattern: ' + esc(g.pattern) + "</p>" : "") +
    "</div>"
  ).join("");
}
