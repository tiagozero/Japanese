    '<div class="player-row">' +
      '<label class="field">Vol <input type="range" min="0" max="1" step="0.01" value="' +
        state.settings.volume + '" data-action="volume" aria-label="Volume"></label>' +
      '<label class="field">Speed <select data-action="speed" aria-label="Playback speed">' + speeds + "</select></label>" +
      '<label class="field">Repeat <select data-action="repeat" aria-label="Repeat count">' + repeats + "</select></label>" +
    "</div>" +
    '<div class="status" data-status></div>' +
    '<div class="player-upload">' +
      '<button class="btn small" data-action="upload-audio" type="button">Upload MP3</button>' +
      '<button class="btn small danger" data-action="remove-audio" type="button" hidden>Remove MP3</button>' +
      '<span class="fname" data-filename></span>' +
    "</div>" +
  "</div>";
}

function renderLesson(){
  if(!state.lesson) return;
  const sentence = currentSentence();
  if(!sentence) return;
  const total = state.lesson.data.sentences.length;

  if(state.progress.reading) state.progress.reading[sentence.id] = true;

  const romajiLine = (state.settings.romaji && sentence.romaji)
    ? '<p class="romaji">' + esc(sentence.romaji) + "</p>" : "";

  const done = !!(state.progress.completed && state.progress.completed[sentence.id]);
  let progDone = 0;
  for(const k in state.progress.completed) if(state.progress.completed[k]) progDone++;
  const pct = total ? Math.round(progDone / total * 100) : 0;

  const toolbar =
    '<div class="lesson-toolbar">' +
      '<span class="toolbar-label">Panels</span>' +
      '<button class="btn toggle" data-action="toggle-vocab-panel" type="button" aria-pressed="' +
        state.settings.showVocabPanel + '">Vocabulary &amp; Grammar Units</button>' +
      '<button class="btn toggle" data-action="toggle-grammar-panel" type="button" aria-pressed="' +
        state.settings.showGrammarPanel + '">Grammar Notes</button>' +
      '<button class="btn toggle" data-action="toggle-kana-panel" type="button" aria-pressed="' +
        state.settings.showKanaPanel + '">Kana Information &amp; Practice</button>' +
      '<span class="spacer"></span>' +
      '<span class="muted" style="font-size:.82rem">' + progDone + " / " + total + " completed — " + pct + "%</span>" +
    "</div>";

  const col1 =
    '<div class="col col-1">' +
      '<div class="col-head">Sentence &amp; Audio</div>' +
      '<div class="card">' +
        '<div class="sentence-nav">' +
          '<button class="btn" data-action="prev" type="button" aria-label="Previous sentence">← Previous</button>' +
          '<span class="counter"><strong>' + (state.index + 1) + "</strong> / " + total + "</span>" +
          '<button class="btn" data-action="next" type="button" aria-label="Next sentence">Next →</button>' +
        "</div>" +
        '<div class="sentence-block">' +
          '<p class="sentence jp" lang="ja">' + sentenceHTML(sentence) + "</p>" +
          romajiLine +
        "</div>" +
        '<div class="display-controls">' +
          '<button class="btn toggle" data-action="toggle-furigana" type="button" aria-pressed="' +
            state.settings.furigana + '">Furigana: ' + (state.settings.furigana ? "ON" : "OFF") + "</button>" +
          '<button class="btn toggle" data-action="toggle-romaji" type="button" aria-pressed="' +
            state.settings.romaji + '">Romaji: ' + (state.settings.romaji ? "ON" : "OFF") + "</button>" +
        "</div>" +
        playerHTML() +
        '<div class="meaning-block">' +
          '<div class="meaning-label">Meaning</div>' +
          '<p class="meaning">' + esc(sentence.meaning || "") + "</p>" +
        "</div>" +
        '<div class="aids-controls">' +
          '<button class="btn toggle" data-action="toggle-chunks" type="button" aria-pressed="' +
            state.reveals.chunks + '">' + (state.reveals.chunks ? "Hide Chunks" : "Show Chunks") + "</button>" +
          '<button class="btn toggle" data-action="toggle-connected" type="button" aria-pressed="' +
            state.reveals.connected + '">' +
            (state.reveals.connected ? "Hide Connected Reading" : "Show Connected Reading") + "</button>" +
        "</div>" +
        (state.reveals.chunks ? '<div class="chunks">' + chunksHTML(sentence) + "</div>" : "") +
        (state.reveals.connected
          ? '<div class="connected jp">' + esc(sentence.connectedReading || "No connected reading provided.") + "</div>"
          : "") +
        '<div class="complete">' +
          '<button class="btn' + (done ? " primary" : "") + '" data-action="toggle-complete" type="button" aria-pressed="' +
            done + '">' + (done ? "✓ Completed (click to undo)" : "Mark sentence complete") + "</button>" +
        "</div>" +
        '<p class="progress">' + progDone + " / " + total + " completed — " + pct + "%</p>" +
      "</div>" +
    "</div>";

  const col2 =
    '<div class="col col-2">' +
      '<div class="col-head">Vocabulary &amp; Grammar Units</div>' +
      '<div class="card"><div class="unit-list">' + vocabUnitsHTML(sentence) + "</div></div>" +
    "</div>";

  const col3 =
    '<div class="col col-3">' +
      '<div class="col-head">Grammar Notes</div>' +
      '<div class="card">' + grammarNotesHTML(sentence) + "</div>" +
    "</div>";

  const col4 =
    '<div class="col col-4">' +
      '<div class="col-head">Kana Information &amp; Practice</div>' +
      '<div class="kana-panel">' +
        '<h2 class="kana-title">Kana</h2>' +
        '<p class="kana-subtitle">Kana used in this lesson (highlighted cells appear in the current sentence).</p>' +
        kanaGridHTML(sentence) +
      "</div>" +
    "</div>";

  const gridAttrs = ' data-vocab="'   + (state.settings.showVocabPanel   ? "shown" : "hidden") +
                    '" data-grammar="' + (state.settings.showGrammarPanel ? "shown" : "hidden") +
                    '" data-kana="'    + (state.settings.showKanaPanel    ? "shown" : "hidden") + '"';

  $("#lessonView").innerHTML =
    toolbar + '<div class="grid4"' + gridAttrs + ">" + col1 + col2 + col3 + col4 + "</div>";

  loadSentenceAudio();
}

/* ============================================================
   Audio
   ============================================================ */
const audioEl = $("#audioEl");

function setPlayerStatus(msg, isErr){
  const el = document.querySelector("[data-status]");
  if(el){ el.textContent = msg || ""; el.classList.toggle("error", !!isErr); }
}
function releaseAudioURL(){
  if(state.audioURL){ try{ URL.revokeObjectURL(state.audioURL); }catch(e){} state.audioURL = null; }
}
function stopAudio(){ try{ audioEl.pause(); }catch(e){} repeatsLeft = 0; countNextPlay = false; }
function updatePlayButton(){
  const btn = document.querySelector('[data-action="play-pause"]');
  if(!btn) return;
  btn.textContent = audioEl.paused ? "▶ Play" : "❚❚ Pause";
  btn.setAttribute("aria-label", audioEl.paused ? "Play" : "Pause");
}
async function loadSentenceAudio(){
  const sentence = currentSentence();
  stopAudio(); releaseAudioURL();

  const seek = document.querySelector('[data-action="seek"]'); if(seek) seek.value = 0;
  const cur = document.querySelector('[data-time="current"]'); if(cur) cur.textContent = "0:00";
  const dur = document.querySelector('[data-time="duration"]'); if(dur) dur.textContent = "0:00";
  const fn = document.querySelector("[data-filename]"); if(fn) fn.textContent = "";
  setPlayerStatus("");

  if(!sentence) return;
  try{ audioEl.removeAttribute("src"); audioEl.load(); }catch(e){}

  let record = null;
  if(state.db){
    try{ record = await idbGet("audio", [state.lesson.id, sentence.id]); }catch(e){}
  }
  let hasUploaded = false;
  if(record && record.blob){
    state.audioURL = URL.createObjectURL(record.blob);
    audioEl.src = state.audioURL;
    if(fn) fn.textContent = record.filename || "uploaded.mp3";
    hasUploaded = true;
    setPlayerStatus("Playing uploaded audio.");
  }else if(sentence.audio){
    audioEl.src = sentence.audio;
    if(fn) fn.textContent = sentence.audio;
    setPlayerStatus("Referenced file: " + sentence.audio);
  }else{
    setPlayerStatus("No audio for this sentence yet. Use “Upload MP3” to add one.");
  }
  const up = document.querySelector('[data-action="upload-audio"]');
  if(up) up.textContent = hasUploaded ? "Replace MP3" : "Upload MP3";
  const rm = document.querySelector('[data-action="remove-audio"]');
  if(rm) rm.hidden = !hasUploaded;

  audioEl.volume = state.settings.volume;
  audioEl.playbackRate = state.settings.speed;
  updatePlayButton();
}

audioEl.addEventListener("loadedmetadata", () => {
  audioEl.volume = state.settings.volume;
  audioEl.playbackRate = state.settings.speed;
  const dur = document.querySelector('[data-time="duration"]');
  if(dur) dur.textContent = fmtTime(audioEl.duration);
});
audioEl.addEventListener("timeupdate", () => {
  const cur = document.querySelector('[data-time="current"]');
  if(cur) cur.textContent = fmtTime(audioEl.currentTime);
  const seek = document.querySelector('[data-action="seek"]');
  if(seek && isFinite(audioEl.duration) && audioEl.duration > 0){
    seek.value = Math.round((audioEl.currentTime / audioEl.duration) * 1000);
  }
});
audioEl.addEventListener("play", () => {
  if(countNextPlay){
    countNextPlay = false;
    const sid = currentSentence().id;
    state.progress.listening[sid] = (state.progress.listening[sid] || 0) + 1;
    saveProgress();
  }
  updatePlayButton();
});
audioEl.addEventListener("pause", updatePlayButton);
audioEl.addEventListener("ended", () => {
  if(repeatsLeft > 0){
    repeatsLeft--;
    try{ audioEl.currentTime = 0; audioEl.play().catch(() => {}); }catch(e){}
    return;
  }
  setPlayerStatus("Finished.");
  updatePlayButton();
});
audioEl.addEventListener("error", () => {
  if(!audioEl.getAttribute("src")) return;
  setPlayerStatus("Audio could not be loaded. The file may be missing or unsupported.", true);
  updatePlayButton();
});

/* ============================================================
   Lesson actions
   ============================================================ */
async function actionPlayPause(){
  if(audioEl.paused){
    if(!audioEl.getAttribute("src")){ setPlayerStatus("No audio available for this sentence.", true); return; }
    countNextPlay = true;
    repeatsLeft = Number(state.settings.repeat) || 0;
    const p = audioEl.play();
    if(p && p.catch) p.catch(err => setPlayerStatus("Playback failed: " + (err && err.message ? err.message : "unknown error"), true));
  }else{ audioEl.pause(); }
}
function actionToggleComplete(){
  const s = currentSentence();
  if(!s || !state.progress) return;
  const cur = !!state.progress.completed[s.id];
  state.progress.completed[s.id] = !cur;
  saveProgress();
  const btn = document.querySelector('[data-action="toggle-complete"]');
  if(btn){
    btn.setAttribute("aria-pressed", String(!cur));
    btn.classList.toggle("primary", !cur);
    btn.textContent = !cur ? "✓ Completed (click to undo)" : "Mark sentence complete";
  }
  const total = state.lesson.data.sentences.length;
  let done = 0;
  for(const k in state.progress.completed) if(state.progress.completed[k]) done++;
  const pct = total ? Math.round(done / total * 100) : 0;
  const prog = document.querySelector(".progress");
  if(prog) prog.textContent = done + " / " + total + " completed — " + pct + "%";
  refreshLibrary();
}
function actionHighlightVocab(vocabId){
  const nodes = $$(".jp-unit" + attr("data-vocab-id", vocabId));
  if(!nodes.length){ showToast("Word not found in this sentence.", ""); return; }
  nodes.forEach(n => {
    n.classList.add("highlight");
    setTimeout(() => n.classList.remove("highlight"), 2200);
  });
  try{ nodes[0].scrollIntoView({ block: "center", behavior: "smooth" }); }catch(e){}
}
async function handleAudioUpload(file){
  const s = currentSentence();
  if(!s || !state.lesson) return;
  const name = (file.name || "").toLowerCase();
  const type = (file.type || "").toLowerCase();
  if(!(name.endsWith(".mp3") || type === "audio/mpeg" || type === "audio/mp3")){
    setPlayerStatus("Invalid file type. Please choose an .mp3 (audio/mpeg) file.", true);
    showToast("Only .mp3 audio files are accepted.", "error");
    return;
  }
  const record = {
    lessonId: state.lesson.id, sentenceId: s.id,
    blob: file, filename: file.name, mime: file.type || "audio/mpeg",
    updatedAt: Date.now()
  };
  try{ await idbPut("audio", record); }
  catch(err){ setPlayerStatus("Could not store audio: " + err.message, true); return; }
  setPlayerStatus("Audio saved for this sentence.");
  await loadSentenceAudio();
}
async function removeAudio(){
  const s = currentSentence();
  if(!s || !state.lesson) return;
  if(!window.confirm("Remove the uploaded MP3 for this sentence?")) return;
  try{ await idbDelete("audio", [state.lesson.id, s.id]); }catch(e){}
  setPlayerStatus("Uploaded audio removed.");
  await loadSentenceAudio();
}
function downloadCSV(){
  if(!state.lesson) return;
  const rows = [["Expression","Reading","Meaning"]];
  state.lesson.data.sentences.forEach(s => rows.push([s.expression || "", s.reading || "", s.meaning || ""]));
  const csv = rows.map(r => r.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(",")).join("\r\n");
  const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = (state.lesson.id || "lesson") + "-sentences.csv";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}
async function resetProgress(){
  if(!state.lesson) return;
  if(!window.confirm('Reset all learning progress for "' + state.lesson.title + '"?\n\nThe lesson and its uploaded audio will be kept.')) return;
  const lessonId = state.lesson.id;
  state.progress = defaultProgress(lessonId);
  state.index = 0;
  try{ await idbDelete("progress", lessonId); await idbPut("progress", state.progress); }
  catch(err){ showToast("Could not reset progress: " + err.message, "error"); }
  const pos = loadPositions(); delete pos[lessonId];
  try{ localStorage.setItem(LS_POS, JSON.stringify(pos)); }catch(e){}
  state.reveals = { chunks: false, connected: false };
  renderLesson();
  refreshLibrary();
  showToast("Progress reset.", "ok");
}

/* ============================================================
   Event wiring
   ============================================================ */
function wireEvents(){

  $("#homeLink").addEventListener("click", e => { e.preventDefault(); goHome(); });
  $("#btnTheme").addEventListener("click", toggleTheme);
  $("#btnJsonFormat").addEventListener("click", showJsonFormatModal);

  $("#btnCreateCourse").addEventListener("click", () => {
    showCourseModal(null, async (data) => { await createCourse(data, false); });
  });

  $("#btnUpload").addEventListener("click", () => {
    state.pendingCourseId = null;
    $("#fileInput").click();
  });
  $("#fileInput").addEventListener("change", e => {
    const f = e.target.files && e.target.files[0];
    handleFileSelected(f);
  });

  /* Course grid — delegation */
  $("#courseList").addEventListener("click", e => {
    const el = e.target.closest("[data-action]");
    if(!el) return;
    const a = el.dataset.action;
    switch(a){
      case "open-course":
        openCourseLessonsModal(el.dataset.course, 1); return;
      case "import-to-course":
        state.pendingCourseId = el.dataset.course;
        $("#fileInput").click();
        return;
      case "edit-course": {
        const course = state.courses.find(c => c.id === el.dataset.course);
        if(!course) return;
        showCourseModal(course, async (data) => { await updateCourse(course.id, data); });
        return;
      }
      case "delete-course": {
        const course = state.courses.find(c => c.id === el.dataset.course);
        if(!course) return;
        const count = getLessonsForCourse(course.id).length;
        showDeleteCourseModal(course, count);
        return;
      }
    }
  });

  /* Delegated clicks inside any open modal (for lesson actions + pagination + course actions) */
  document.addEventListener("click", e => {
    const inModal = e.target.closest(".modal-backdrop");
    if(!inModal) return;

    const el = e.target.closest("[data-action]");
    if(!el) return;
    const a = el.dataset.action;
    switch(a){
      case "open-lesson":
        openLesson(el.dataset.id);
        return;
      case "delete-lesson":
        deleteLesson(el.dataset.id);
        return;
      case "page-prev":
        if(state.courseModal && state.courseModal.page > 1){
          state.courseModal.page--;
          renderCourseLessonsModal();
        }
        return;
      case "page-next":
        if(state.courseModal){
          state.courseModal.page++;
          renderCourseLessonsModal();
        }
        return;
      case "page-go":
        if(state.courseModal){
          state.courseModal.page = Number(el.dataset.page);
          renderCourseLessonsModal();
        }
        return;
      case "import-to-course":
        state.pendingCourseId = el.dataset.course;
        $("#fileInput").click();
        return;
      case "edit-course": {
        const course = state.courses.find(c => c.id === el.dataset.course);
        if(!course) return;
        showCourseModal(course, async (data) => { await updateCourse(course.id, data); });
        return;
      }
      case "delete-course": {
        const course = state.courses.find(c => c.id === el.dataset.course);
        if(!course) return;
        const count = getLessonsForCourse(course.id).length;
        showDeleteCourseModal(course, count);
        return;
      }
    }
  });

  $("#btnCsv").addEventListener("click", downloadCSV);
  $("#btnReset").addEventListener("click", resetProgress);

  /* Lesson view */
  $("#lessonView").addEventListener("click", async e => {
    const token = e.target.closest(".jp-unit.token");
    if(token){
      const s = currentSentence();
      if(!s) return;
      let html = "";
      const vid = token.dataset.vocabId;
      const gid = token.dataset.grammarId;
      if(vid){
        const v = (s.vocabulary || []).find(x => x && x.id === vid);
        if(v){
          html += '<div class="pop-word jp">' + esc(v.text) + "</div>";
          if(v.reading) html += '<div class="pop-row">Reading: <b class="jp">' + esc(v.reading) + "</b></div>";
          if(v.romaji)  html += '<div class="pop-row">Romaji: <b>' + esc(v.romaji) + "</b></div>";
          if(v.meaning) html += '<div class="pop-row">Meaning: <b>' + esc(v.meaning) + "</b></div>";
          if(v.partOfSpeech) html += '<div class="pop-row">Part of speech: <b>' + esc(v.partOfSpeech) + "</b></div>";
        }
      }
      if(gid){
        const g = (s.grammar || []).find(x => x && x.id === gid);
        if(g){
          html += '<div class="pop-word jp">' + esc(g.title) + "</div>";
          if(g.pattern) html += '<div class="pop-row">Pattern: <b class="jp">' + esc(g.pattern) + "</b></div>";
          if(g.explanation) html += '<div class="pop-row">' + esc(g.explanation) + "</div>";
        }
      }
      if(html) showPopup(token, html);
      return;
    }

    const el = e.target.closest("[data-action]");
    if(!el) return;
    const a = el.dataset.action;
    switch(a){
      case "prev": goToSentence(state.index - 1); return;
      case "next": goToSentence(state.index + 1); return;
      case "play-pause": await actionPlayPause(); return;
      case "restart": try{ audioEl.currentTime = 0; }catch(err){} return;
      case "toggle-vocab-panel":
        state.settings.showVocabPanel = !state.settings.showVocabPanel;
        saveSettings(); renderLesson(); return;
      case "toggle-grammar-panel":
        state.settings.showGrammarPanel = !state.settings.showGrammarPanel;
        saveSettings(); renderLesson(); return;
      case "toggle-kana-panel":
        state.settings.showKanaPanel = !state.settings.showKanaPanel;
        saveSettings(); renderLesson(); return;
      case "toggle-furigana":
        state.settings.furigana = !state.settings.furigana;
        if(state.settings.furigana) state.settings.romaji = false;
        saveSettings(); renderLesson(); return;
      case "toggle-romaji":
        state.settings.romaji = !state.settings.romaji;
        if(state.settings.romaji) state.settings.furigana = false;
        saveSettings(); renderLesson(); return;
      case "toggle-chunks":
        state.reveals.chunks = !state.reveals.chunks; renderLesson(); return;
      case "toggle-connected":
        state.reveals.connected = !state.reveals.connected; renderLesson(); return;
      case "toggle-complete": actionToggleComplete(); return;
      case "highlight-vocab": actionHighlightVocab(el.dataset.vocabId); return;
      case "scroll-grammar": {
        const items = $$(".grammar-item");
        if(items.length) items[0].scrollIntoView({ block: "nearest", behavior: "smooth" });
        return;
      }
      case "upload-audio": {
        const inp = document.createElement("input");
        inp.type = "file"; inp.accept = ".mp3,audio/mpeg";
        inp.addEventListener("change", ev => {
          const f = ev.target.files && ev.target.files[0];
          if(f) handleAudioUpload(f);
        });
        inp.click();
        return;
      }
      case "remove-audio": await removeAudio(); return;
    }
  });

  $("#lessonView").addEventListener("input", e => {
    const el = e.target.closest("[data-action]");
    if(!el) return;
    if(el.dataset.action === "seek"){
      const v = Number(el.value);
      if(isFinite(audioEl.duration) && audioEl.duration > 0){
        try{ audioEl.currentTime = (v / 1000) * audioEl.duration; }catch(err){}
      }
    }else if(el.dataset.action === "volume"){
      const v = Number(el.value);
      state.settings.volume = v; audioEl.volume = v; saveSettings();
    }
  });

  $("#lessonView").addEventListener("change", e => {
    const el = e.target.closest("[data-action]");
    if(!el) return;
    if(el.dataset.action === "speed"){
      const v = Number(el.value);
      state.settings.speed = v; audioEl.playbackRate = v; saveSettings();
    }else if(el.dataset.action === "repeat"){
      const v = Number(el.value);
      state.settings.repeat = v; repeatsLeft = v; saveSettings();
    }
  });

  document.addEventListener("keydown", e => {
    if(e.key === "Escape"){ hidePopup(); return; }
    const t = e.target.closest ? e.target.closest(".jp-unit.token") : null;
    if(t && (e.key === "Enter" || e.key === " ")){
      e.preventDefault(); t.click(); return;
    }
    if(e.target.matches && e.target.matches("input,select,textarea")) return;
    if(!state.lesson || $("#lessonView").hidden) return;
    if(e.key === "ArrowLeft"  && !e.target.closest("button")) goToSentence(state.index - 1);
    if(e.key === "ArrowRight" && !e.target.closest("button")) goToSentence(state.index + 1);
  });

  document.addEventListener("click", e => {
    if($("#vocabPopup").hidden) return;
    if(e.target.closest("#vocabPopup")) return;
    if(e.target.closest(".jp-unit.token")) return;
    hidePopup();
  });

  window.addEventListener("scroll", hidePopup, { passive: true });
  window.addEventListener("resize", hidePopup);
  window.addEventListener("beforeunload", releaseAudioURL);
}

/* ============================================================
   Init
   ============================================================ */
async function init(){
  loadSettings();
  applyTheme();
  wireEvents();
  try{ state.db = await openDB(); }
  catch(err){ state.db = null; showToast("Local storage is unavailable: " + err.message, "error"); }
  await refreshLibrary();
  if(state.db){
    const stored = localStorage.getItem(LS_CURRENT);
    if(stored){
      let rec = null;
      try{ rec = await idbGet("lessons", stored); }catch(e){}
      if(rec) await openLesson(stored);
      else localStorage.removeItem(LS_CURRENT);
    }
  }
}

init();
</script>
